name: Deploy MERAKI Application workflow

on:
  push:
    branches: [ dev ]

env:
  AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
  AZURE_VM_USERNAME: ${{ secrets.AZURE_VM_USERNAME }}
  AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  SSH_OPTS: "-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3"

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        chmod 700 ~/.ssh
        echo "${{ secrets.AZURE_VM_HOST }} $(ssh-keyscan -H ${{ secrets.AZURE_VM_HOST }} 2>/dev/null || echo '')" >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        
        # Test SSH connection with retries
        for i in {1..3}; do
          echo "SSH connection attempt $i..."
          if ssh -v $SSH_OPTS ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} 'echo "SSH connection successful"'; then
            echo "SSH connection established successfully"
            break
          else
            echo "SSH connection attempt $i failed"
            if [ $i -eq 3 ]; then
              echo "All SSH connection attempts failed"
              exit 1
            fi
            sleep 5
          fi
        done

    - name: Copy Manifest Files
      run: |
        # Create directory on VM
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} 'mkdir -p ~/manifestfiles'
        
        # Copy all manifest files to VM
        scp -o StrictHostKeyChecking=no ./manifestfiles/* ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }}:~/manifestfiles/
        
        # Verify files were copied
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} 'ls -la ~/manifestfiles'

    - name: Create Fixed Deployment Files
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          # Create updated backend deployment file with read-write filesystem
          cat > ~/manifestfiles/backend-deployment-fixed.yml << "EOF"
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend-deployment
            namespace: backend
          spec:
            replicas: 2
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            selector:
              matchLabels:
                app: backend
            template:
              metadata:
                labels:
                  app: backend
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "8000"
              spec:
                imagePullSecrets:
                  - name: acr-secret
                containers:
                  - name: backend
                    image: immihubacr.azurecr.io/immihub-be:latest
                    imagePullPolicy: Always
                    resources:
                      requests:
                        cpu: "200m"
                        memory: "256Mi"
                      limits:
                        cpu: "1000m"
                        memory: "1Gi"
                    env:
                      - name: PYTHONDONTWRITEBYTECODE
                        value: "1"
                      - name: PYTHONUNBUFFERED
                        value: "1"
                      - name: DJANGO_SETTINGS_MODULE
                        value: "meraki.settings"
                      - name: ALLOWED_HOSTS
                        value: "*"
                      - name: DEBUG
                        value: "True"
                    ports:
                      - containerPort: 8000
                        name: http
                    volumeMounts:
                      - name: tmp-volume
                        mountPath: /tmp
                      - name: app-data
                        mountPath: /app/data
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: http
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                      successThreshold: 1
                      failureThreshold: 5
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: http
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 10
                      successThreshold: 1
                      failureThreshold: 3
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      runAsNonRoot: true
                      runAsUser: 1000
                volumes:
                  - name: tmp-volume
                    emptyDir: {}
                  - name: app-data
                    emptyDir: {}
          EOF
          
          # Create updated frontend deployment file with emptyDir for /tmp
          cat > ~/manifestfiles/frontend-deployment-fixed.yml << "EOF"
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend-deployment
            namespace: frontend
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: frontend
            template:
              metadata:
                labels:
                  app: frontend
              spec:
                containers:
                - name: frontend
                  image: immihubacr.azurecr.io/immihub-fe:latest
                  ports:
                  - containerPort: 3000
                  volumeMounts:
                  - mountPath: /tmp
                    name: tmp-volume
                volumes:
                - name: tmp-volume
                  emptyDir: {}
                imagePullSecrets:
                - name: acr-secret
          EOF
        '

    - name: Install Kubernetes Tools
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          echo "Installing Kubernetes tools..."
          
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Install kind
          [ $(uname -m) = x86_64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          
          # Delete existing cluster if it exists
          kind delete cluster || true
          
          # Create kind cluster with your configuration
          kind create cluster --config ~/manifestfiles/kind-cluster.yml
          
          # Wait for cluster to be ready
          sleep 30
          kubectl cluster-info
          kubectl get nodes
        '

    - name: Create Namespaces and ACR Secret
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          echo "Creating namespaces and ACR secret..."
          
          # Install jq if not present
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          
          # Create namespaces
          kubectl apply -f ~/manifestfiles/Namespace.yml --validate=false
          
          # Wait for namespaces to be created
          sleep 10
          
          # Create ACR secret in frontend namespace
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=frontend \
            --validate=false
          
          # Create ACR secret in backend namespace
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=backend \
            --validate=false
          
          # Verify namespaces and secrets
          echo "Verifying namespaces:"
          kubectl get namespaces
          echo "Verifying secrets:"
          kubectl get secrets --all-namespaces | grep acr-secret
          
          # Verify secret contents (without showing sensitive data)
          echo "Verifying secret configuration:"
          kubectl get secret acr-secret -n frontend -o jsonpath="{.data.\.dockerconfigjson}" | base64 -d | jq -r ".auths.\"${{ secrets.ACR_LOGIN_SERVER }}\".username"
        '

    - name: Deploy Frontend
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          echo "Starting frontend deployment..."
          
          # Clone frontend repository
          rm -rf ~/MERAKI-FE
          git clone -b development https://github.com/TEAM-MERAKI-NAA/MERAKI-FE.git ~/MERAKI-FE
          cd ~/MERAKI-FE
          
          # Login to ACR
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
          
          # Build and push frontend image
          docker build -t immihub-fe .
          docker tag immihub-fe ${{ secrets.ACR_LOGIN_SERVER }}/immihub-fe:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/immihub-fe:latest
          
          # Apply Kubernetes manifests for frontend in frontend namespace using the fixed deployment file
          kubectl apply -f ~/manifestfiles/frontend-deployment-fixed.yml
          kubectl apply -f ~/manifestfiles/frontend-service.yml -n frontend
          
          # Wait for frontend deployment to be ready with increased timeout
          echo "Waiting for frontend deployment to be ready..."
          kubectl -n frontend wait --for=condition=available deployment/frontend-deployment --timeout=600s
          
          # Verify frontend deployment
          echo "Frontend deployment status:"
          kubectl get all -n frontend
        '

    - name: Deploy Backend
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          echo "Starting backend deployment..."
          
          # Clone backend repository
          rm -rf ~/MERAKI-BE
          git clone -b swagat-newbase https://github.com/TEAM-MERAKI-NAA/MERAKI-BE.git ~/MERAKI-BE
          cd ~/MERAKI-BE
          
          # Login to ACR
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
          
          # Build and push backend image
          docker build -t immihub-be .
          docker tag immihub-be ${{ secrets.ACR_LOGIN_SERVER }}/immihub-be:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/immihub-be:latest
          
          # Apply Kubernetes manifests for backend in backend namespace using the fixed deployment file
          kubectl apply -f ~/manifestfiles/backend-deployment-fixed.yml
          kubectl apply -f ~/manifestfiles/backend-service.yml -n backend
          
          # Wait for backend deployment to be ready with increased timeout
          echo "Waiting for backend deployment to be ready (this may take several minutes)..."
          kubectl -n backend wait --for=condition=available deployment/backend-deployment --timeout=600s || true
          
          # Verify backend deployment 
          echo "Backend deployment status:"
          kubectl get all -n backend
        '

    - name: Debug Backend if Needed
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          # Check if any pods are in CrashLoopBackOff state
          if kubectl get pods -n backend | grep -q "CrashLoopBackOff"; then
            echo "Backend pods are still crashing, collecting detailed logs..."
            
            echo "Pod details:"
            kubectl describe pods -n backend -l app=backend
            
            echo "Container logs:"
            for pod in $(kubectl get pods -n backend -l app=backend -o jsonpath="{.items[*].metadata.name}"); do
              echo "Logs for pod $pod:"
              kubectl logs -n backend $pod --previous || echo "No previous logs available"
              kubectl logs -n backend $pod || echo "No current logs available"
            done
            
            echo "Checking node status:"
            kubectl describe nodes
            
            echo "Checking events:"
            kubectl get events -n backend --sort-by=.metadata.creationTimestamp
          else
            echo "Backend pods appear to be running normally"
          fi
        '

    - name: Verify Deployments
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          echo "Verifying deployments in each namespace..."
          
          echo "Frontend namespace resources:"
          kubectl get all -n frontend
          
          echo "Backend namespace resources:"
          kubectl get all -n backend
          
          echo "Services in all namespaces:"
          kubectl get services --all-namespaces
          
          echo "Verifying service ports..."
          echo "Frontend service port:"
          kubectl get service frontend-service -n frontend -o jsonpath="{.spec.ports[0].port}"
          echo -e "\nBackend service port:"
          kubectl get service backend-service -n backend -o jsonpath="{.spec.ports[0].port}"
          
          # Verify pods are running
          echo "Checking pod status..."
          kubectl get pods -n frontend
          kubectl get pods -n backend
          
          # Check pod logs if needed
          echo "Checking frontend pod logs:"
          kubectl logs -n frontend -l app=frontend --tail=30
          echo "Checking backend pod logs:"
          kubectl logs -n backend -l app=backend --tail=30
        '

    - name: Improved Health Check
      run: |
        ssh $SSH_OPTS ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          echo "Starting health checks on VM..."
          
          # Check if pods are running
          echo "Checking pod status..."
          frontend_ready=$(kubectl get pods -n frontend -o jsonpath="{.items[*].status.containerStatuses[0].ready}" | tr -d "[:space:]")
          backend_ready=$(kubectl get pods -n backend -o jsonpath="{.items[*].status.containerStatuses[0].ready}" | tr -d "[:space:]")
          
          echo "Frontend pods ready status: $frontend_ready"
          echo "Backend pods ready status: $backend_ready"
          
          # Create a test pod to check the services from inside the cluster
          echo "Creating test pod for service checks..."
          cat << EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: curl-test
            namespace: default
          spec:
            containers:
            - name: curl
              image: curlimages/curl
              command: ["sleep", "300"]
            restartPolicy: Never
          EOF
          
          # Wait for the test pod to be ready
          echo "Waiting for test pod to be ready..."
          kubectl wait --for=condition=ready pod/curl-test --timeout=60s
          
          # Test frontend from inside the cluster
          echo "Testing frontend service from inside cluster..."
          kubectl exec curl-test -- curl -s -m 10 http://frontend-service.frontend:3000 > /dev/null && \
            echo "Frontend service is accessible" || echo "Frontend service is not accessible"
          
          # Test backend from inside the cluster
          echo "Testing backend service from inside cluster..."
          kubectl exec curl-test -- curl -s -m 10 http://backend-service.backend:8000 > /dev/null && \
            echo "Backend service is accessible" || echo "Backend service is not accessible"
          
          # Clean up test pod
          echo "Cleaning up test pod..."
          kubectl delete pod curl-test
        ' || {
          echo "Health check completed with issues. See logs above for details."
          # Don't fail the workflow here, just continue and record the result
        }

    - name: Export Service Information
      run: |
        ssh $SSH_OPTS ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} '
          # Get NodePort information for accessing the services
          frontend_port=$(kubectl get svc frontend-service -n frontend -o jsonpath="{.spec.ports[0].nodePort}")
          backend_port=$(kubectl get svc backend-service -n backend -o jsonpath="{.spec.ports[0].nodePort}")
          
          # Get worker node IP for external access
          node_ip=$(kubectl get nodes -o jsonpath="{.items[0].status.addresses[?(@.type==\"InternalIP\")].address}")
          
          echo "===== Service Access Information ====="
          echo "Frontend available at: http://$node_ip:$frontend_port"
          echo "Backend available at: http://$node_ip:$backend_port"
          echo "====================================="
        '

    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up SSH keys..."
        rm -f ~/.ssh/id_rsa
        echo "Deployment workflow completed."